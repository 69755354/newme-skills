<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore customer budgets, fixed Dubai egress routes and billing reconciliation in an interactive Amazon Bedrock gateway demo.">
  <title>Gateway prototype · Bedrock Console</title>
  <link rel="stylesheet" href="../../prototype/app.css">
  <link rel="stylesheet" href="en.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <main class="nojs">
      <h1>Bedrock Console</h1>
      <p>This interactive demo requires JavaScript. <a href="../#product">Read the product design</a> or <a href="../../prototype/" lang="zh-CN" hreflang="zh-CN">中文</a>.</p>
    </main>
  </div>
  <dialog id="confirmBox" aria-labelledby="confirmTitle" aria-describedby="confirmText">
    <h2 id="confirmTitle"></h2>
    <p id="confirmText"></p>
    <div class="actions right">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="button" id="confirmBtn" class="mainBtn">Confirm</button>
    </div>
  </dialog>
</body>
</html>
